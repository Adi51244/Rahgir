<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Yellow background circle matching ticket icon exactly -->
  <circle cx="50" cy="50" r="48" fill="#fbc02d" />
  
  <!-- Subtle shadow under wheels -->
  <ellipse cx="35" cy="68" rx="8" ry="2" fill="rgba(0,0,0,0.18)" />
  <ellipse cx="65" cy="68" rx="8" ry="2" fill="rgba(0,0,0,0.18)" />

  <!-- Roof Luggage / AC Unit -->
  <rect x="42" y="34.5" width="16" height="3" rx="1.5" fill="#455a64" stroke="#263238" stroke-width="1.2" />

  <!-- Bus Outer Shell (with crisp dark outline) -->
  <!-- Top half (Windows area): Light Blue Glass -->
  <path d="M 28 41 Q 25 44 24 50 L 24 55 L 76 55 L 76 41 Q 76 38 72 38 L 32 38 Q 29 38 28 41 Z" 
        fill="#b3e5fc" stroke="#263238" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Bottom half (Lower body): Orange/Yellow Gradient -->
  <path d="M 23 53 L 23 60 Q 23 62 25 62 L 28.5 62 A 6.5 6.5 0 0 1 41.5 62 L 58.5 62 A 6.5 6.5 0 0 1 71.5 62 L 75 62 Q 77 62 77 60 L 77 53 Z" 
        fill="#ff9800" stroke="#263238" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Window Dividers & Frames -->
  <!-- Windshield -->
  <path d="M 28 41.5 Q 26 44.5 25.5 50 L 25.5 53 L 34 53 L 34 40 L 32 40 Q 29.5 40 28 41.5 Z" 
        fill="#81d4fa" stroke="#263238" stroke-width="1.5" />
  <!-- Door window -->
  <rect x="36" y="40" width="7" height="13" rx="1" fill="#b3e5fc" stroke="#263238" stroke-width="1.5" />
  <!-- Middle window -->
  <rect x="45.5" y="40" width="13.5" height="13" rx="1" fill="#b3e5fc" stroke="#263238" stroke-width="1.5" />
  <!-- Rear window -->
  <rect x="61.5" y="40" width="12.5" height="13" rx="1" fill="#b3e5fc" stroke="#263238" stroke-width="1.5" />

  <!-- Glass Reflection Sheen -->
  <path d="M 47 41 L 52 41 L 49 52 L 46.5 52 Z" fill="rgba(255,255,255,0.4)" />
  <path d="M 63 41 L 68 41 L 65 52 L 62.5 52 Z" fill="rgba(255,255,255,0.4)" />

  <!-- Door Outline extending down to lower body -->
  <line x1="36" y1="53" x2="36" y2="61.5" stroke="#263238" stroke-width="1.5" />
  <line x1="43" y1="53" x2="43" y2="61.5" stroke="#263238" stroke-width="1.5" />

  <!-- Headlight & Tail light -->
  <circle cx="24.5" cy="56.5" r="1.8" fill="#fff9c4" stroke="#263238" stroke-width="0.8" />
  <rect x="75" y="55" width="2" height="3" rx="0.5" fill="#f44336" />

  <!-- Front Wheel -->
  <circle cx="35" cy="62" r="6" fill="#263238" stroke="#102027" stroke-width="1" />
  <circle cx="35" cy="62" r="2.6" fill="#cfd8dc" />
  <circle cx="35" cy="62" r="1" fill="#263238" />

  <!-- Rear Wheel -->
  <circle cx="65" cy="62" r="6" fill="#263238" stroke="#102027" stroke-width="1" />
  <circle cx="65" cy="62" r="2.6" fill="#cfd8dc" />
  <circle cx="65" cy="62" r="1" fill="#263238" />
</svg>
