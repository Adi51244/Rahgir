<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Yellow background circle matching ticket logo -->
  <circle cx="50" cy="50" r="48" fill="#fbc02d" />
  
  <!-- Bus shadow / ground -->
  <ellipse cx="50" cy="79" rx="28" ry="3.5" fill="rgba(0,0,0,0.18)" />

  <!-- Main Bus Body (Teal/Blue with White roof accent) -->
  <rect x="22" y="27" width="56" height="46" rx="9" fill="#29b6f6" />
  <path d="M 22 36 Q 22 27 31 27 L 69 27 Q 78 27 78 36 L 78 40 L 22 40 Z" fill="#ffffff" />
  
  <!-- Destination / Boarding Header Board -->
  <rect x="34" y="30" width="32" height="6.5" rx="2" fill="#1a0f0a" />
  <circle cx="38" cy="33.25" r="1" fill="#ffeb3b" />
  <line x1="42" y1="33.25" x2="62" y2="33.25" stroke="#ffeb3b" stroke-width="1.2" stroke-linecap="round" />

  <!-- Windshield / Front Windows -->
  <rect x="26" y="42" width="22" height="15" rx="3.5" fill="#0f172a" />
  <rect x="52" y="42" width="22" height="15" rx="3.5" fill="#0f172a" />
  <!-- Glass highlights -->
  <path d="M 28 44 L 38 44 L 30 55 L 28 55 Z" fill="rgba(255,255,255,0.25)" />
  <path d="M 54 44 L 64 44 L 56 55 L 54 55 Z" fill="rgba(255,255,255,0.25)" />

  <!-- Grille & License Plate -->
  <rect x="42" y="60" width="16" height="6" rx="1.5" fill="#1e293b" />
  <line x1="44" y1="62" x2="56" y2="62" stroke="#64748b" stroke-width="0.9" />
  <line x1="44" y1="64" x2="56" y2="64" stroke="#64748b" stroke-width="0.9" />

  <!-- Headlights -->
  <circle cx="28.5" cy="62.5" r="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
  <circle cx="28.5" cy="62.5" r="2.2" fill="#fff59d" />
  <circle cx="71.5" cy="62.5" r="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
  <circle cx="71.5" cy="62.5" r="2.2" fill="#fff59d" />

  <!-- Orange Side Indicators -->
  <circle cx="24.5" cy="68" r="1.5" fill="#ff9800" />
  <circle cx="75.5" cy="68" r="1.5" fill="#ff9800" />

  <!-- Bumper -->
  <rect x="20" y="69" width="60" height="5" rx="2.5" fill="#334155" />

  <!-- Wheels -->
  <rect x="25" y="72" width="8" height="7" rx="3" fill="#0f172a" />
  <rect x="67" y="72" width="8" height="7" rx="3" fill="#0f172a" />
  <circle cx="29" cy="75" r="1.5" fill="#64748b" />
  <circle cx="71" cy="75" r="1.5" fill="#64748b" />
</svg>
